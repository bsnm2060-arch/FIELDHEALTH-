name: Build Android APK
on:
  push:
    branches: [ "رئيسي", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Unzip Project Files
      run: unzip FIELDHEALTH_Android_Final_Build.zip -d .
      
    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x FIELDHEALTH_Android/gradlew

    - name: Build with Gradle
      run: cd FIELDHEALTH_Android && ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: my-app-apk
        path: FIELDHEALTH_Android/app/build/outputs/apk/debug/app-debug.apk
        
